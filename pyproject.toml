[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicomp-sdk"
version = "3.1.1"
description = "AI Agent Security Competition SDK - Red teaming framework for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Competition Organizers" }]
keywords = [
  "ai",
  "security",
  "red-team",
  "guardrails",
  "llm",
  "agent-safety",
  "adversarial-ml",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "transformers>=4.30.0",
  "torch>=2.0.0",
  "openai>=1.0.0",
  "gymnasium>=0.29,<1",
]

[project.scripts]
aicomp = "aicomp_sdk.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
]
docs = ["sphinx>=6.0.0", "sphinx-rtd-theme>=1.2.0"]

[project.urls]
Homepage = "https://github.com/mbhatt1/competitionscratch"
Documentation = "https://github.com/mbhatt1/competitionscratch/blob/main/docs/README.md"
Repository = "https://github.com/mbhatt1/competitionscratch"
"Bug Tracker" = "https://github.com/mbhatt1/competitionscratch/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*", "scripts*", "research*", "docs*"]

[tool.setuptools.package-data]
aicomp_sdk = [
  "py.typed",
  "fixtures/*.json",
  "fixtures/file_seed/*.txt",
  "fixtures/file_seed/*.json",
  "fixtures/file_seed/*.md",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai.types.responses.response_create_params"]
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "transformers"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers -m 'not benchmark'"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "benchmark: long-running report or benchmark tests that are excluded from default pytest",
  "external_model: tests that require access to external model artifacts",
]
